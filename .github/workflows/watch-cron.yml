# Runs the competitor-watch check daily on GitHub (works even on Vercel Hobby,
# which lacks native Cron). Requires a repository secret CRON_SECRET that matches
# the Vercel environment variable CRON_SECRET (or set WATCH_ADMIN_TOKEN on Vercel
# and mirror it here as CRON_SECRET). If no secret is configured anywhere, the
# check still runs because /api/watch?cron=1 accepts the x-vercel-cron header.
name: watch-cron

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel competitor watch
        run: |
          curl -fsS -X GET \
            -H "x-vercel-cron: 1" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://vamshidharm.vercel.app/api/watch?cron=1"
